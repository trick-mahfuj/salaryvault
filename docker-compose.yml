# =============================================
# Docker Compose — MNIT Work Ledger (Production)
# =============================================
services:
  # --------------------------------------------------
  # App — Next.js production server on port 3000
  # --------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Persistent encrypted sync storage (survives container restarts)
      - mnit-sync-data:/app/.mnit-sync
    # Security: no privileged mode, read-only rootfs where possible
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

# --------------------------------------------------
# Named volumes for persistent data
# --------------------------------------------------
volumes:
  mnit-sync-data:
    driver: local
